<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figuras</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section class="container">
        <div class="figuras">
            <h2>Quadrado</h2>
            <form action="" method="get" id="formQuadrado">
                <label for="lado">Lado</label>
                <input type="text" id="ladoQuadrado" name="lado">
                <input type="submit" value="submit">
                <label for="area">Área</label>
            </form>
            <p id="areaResQ">Valor da Área</p>
        </div>

        <div class="figuras">
            <h2>Retângulo</h2>
            <form action="" method="get" id="formRetangulo">
                <label for="lado">Base</label>
                <input type="text" id="baseRetangulo" name="lado">
                <label for="altura">Altura</label>
                <input type="text" id="alturaRetangulo" name="altura">
                <input type="submit" value="submit">
            </form>
            <p id="areaResR">Valor da Área</p>
        </div>

        <div class="figuras">
            <h2>Triângulo</h2>
            <form action="" method="get" id="formTriangulo">
                <label for="lado">Base</label>
                <input type="text" id="baseTriangulo" name="base">
                <label for="altura">Altura</label>
                <input type="text" id="alturaTriangulo" name="altura">
                <input type="submit" value="submit">
            </form>
            <p id="areaResT">Valor da Área</p>
        </div>

        <div class="figuras">
            <h2>Círculo</h2>
            <form action="" method="get" id="formCirculo">
                <label for="lado">Raio</label>
                <input type="text" id="raioCirculo" name="lado">
                <input type="submit" value="submit">
            </form>
            <p id="areaResC">Valor da Área</p>
        </div>
    </section>
</body>


<script type="module" src="index.js"></script>
</html>
