<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="container">
        <div id="agenda">
            <form action="" method="get" id="formAgenda">
                <label for="lado">Nome</label>
                <input type="text" id="nomeContato" name="nome">
                <label for="altura">Telefone</label>
                <input type="text" id="telefoneContato" name="telefone">
                <button type="submit" id="submit-btn">
                    Salvar
                </button>
            </form>
        </div>

    </section>


    <script type="module" src="script.js"></script>
</body>

</html>
